<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>推流端 · LAN Guard</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  .push-actions { display: flex; gap: 10px; margin-top: 12px; }
  .push-actions button {
    flex: 1; padding: 14px; font-size: 16px; border: none;
    border-radius: 12px; cursor: pointer; color: #fff;
  }
  #btn-start { background: var(--green); }
  #btn-stop { background: var(--red); display: none; }
  #btn-flip { background: var(--line); }
  #push-state {
    margin-top: 12px; padding: 12px 14px; border-radius: 12px;
    background: var(--card); border: 1px solid var(--line); font-size: 14px;
  }
  #push-state .st-line { display: flex; justify-content: space-between; padding: 3px 0; }
  #push-state .k { color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>📡 推流端</h1>
  <span id="conn-dot" class="dot offline"></span>
</header>

<main>
  <section class="video-box">
    <video id="video" autoplay playsinline muted></video>
    <div id="video-status" class="video-status">点击下方"开始推流"授权摄像头</div>
  </section>

  <div class="push-actions">
    <button id="btn-start">▶ 开始推流</button>
    <button id="btn-stop">■ 停止</button>
    <button id="btn-flip">🔄 翻转</button>
  </div>

  <section id="push-state">
    <div class="st-line"><span class="k">状态</span><span id="st-state">未推流</span></div>
    <div class="st-line"><span class="k">已推流时长</span><span id="st-duration">--</span></div>
    <div class="st-line"><span class="k">屏幕常亮</span><span id="st-wakelock">--</span></div>
    <div class="st-line"><span class="k">说明</span><span class="k">请保持本页面在前台、接通电源、
      设置→显示→自动锁定=永不</span></div>
  </section>
</main>

<script src="/static/push.js?v=3"></script>
</body>
</html>
